    * ============================================ API SUMMARY ==============================
    *
    * Path     : /api/v1/frs021/AIRLINE
    * Operation: CreateAIRLINE
    *
    * Request
    *    Parameter: None
    *    Schema   : AIRLINEObject
    *
    * Response
    *    Schema   : AIRLINEObject
    *
    * Action  : Insert details into table FLIGHTSZ
    *
    * =======================================================================================
    Srvroutine Name(CreateAIRLINE) Response(*HTTP #Context)
    * Instance of the CreateAIRLINE operation
    Define_Com Class(#Com_Home.CreateAIRLINE) Name(#Operation)
    * Instance of the AIRLINEObject component used by Operation CreateAIRLINE
    Define_Com Class(#Com_Home.AIRLINEObject) Name(#AIRLINEObject)

    If (#Operation.TryBind( #Context ))
    Get Com(#Operation.Request.ContentJson) Com_Fields(#AIRLINEObject)

    Begincheck
    Insert Fields(#AIRLINEObject) To_File(FLIGHTSZ) Io_Status(#io$sts) Io_Error(*NEXT) Val_Error(*NEXT) Check_Only(*YES)
    If_Status Is_Not(*OKAY)
    Message Msgtxt("AIRLINE includes invalid data")
    Endif
    Endcheck If_Error(*RETURN400)

    Insert Fields(#AIRLINEObject) To_File(FLIGHTSZ) Io_Status(#io$sts) Io_Error(*NEXT) Val_Error(*NEXT)
    If (#Operation.CheckIoStatus( #io$sts ))
    Set Com(#AIRLINEObject) Com_Fields(*ALL)
    #Operation.Response.SetContentJson( #AIRLINEObject )
    Endif
    Else
    * Bad Response automatically handled by LANSA
    Endif
    Endroutine

    * ============================================ API SUMMARY ==============================
    *
    * Path     : /api/v1/frs021/AIRLINE/{FFLGHT}
    * Operation: DeleteAIRLINE
    *
    * Request
    *    Parameter: FFLGHT in Path
    *    Schema   : None
    *
    * Response
    *    Schema   : None
    *
    * Action  : Delete AIRLINE with key FFLGHT from table FLIGHTSZ
    *
    * =======================================================================================
    Srvroutine Name(DeleteAIRLINE) Response(*HTTP #Context)
    * Instance of the DeleteAIRLINE operation
    Define_Com Class(#Com_Home.DeleteAIRLINE) Name(#Operation)

    If (#Operation.TryBind( #Context ))
    Begincheck
    Filecheck Field(#FFLGHT) Using_File(FLIGHTSZ) Using_Key(#Operation.Request.FFLGHT) Msgtxt("AIRLINE with key " + #Operation.Request.FFLGHT.AsString + " not found.")
    Endcheck If_Error(*RETURN404)

    Delete From_File(FLIGHTSZ) With_Key(#Operation.Request.FFLGHT) Io_Status(#io$sts) Io_Error(*NEXT) Val_Error(*NEXT)
    If (#Operation.CheckIoStatus( #io$sts ))
    #Operation.Response.Set204
    Else
    * Bad response automatically handled by LANSA
    Endif
    Else
    * Bad response automatically handled by LANSA
    Endif
    Endroutine

    End_Com
